name: Release

# Workstream K (distribution & auto-update). Triggers on a real version tag
# push (e.g. `v0.2.0`) — publishing a real GitHub Release is a deliberate,
# visible action, never something this workflow does on its own initiative.
# A 3-OS matrix so Windows/Linux/macOS each build and publish their own
# native artifacts to the same release, matching electron-updater's own
# per-platform expectations.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
